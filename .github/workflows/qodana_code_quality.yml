name: Qodana

# Static analysis on pull requests and main. Two choices are load-bearing here:
#
#   1. Native mode (--within-docker false). The container form gives Qodana its own Gradle home,
#      unwarmed by setup-env, and pulls a 4.15 GB image. It requires qodana.yml's `linter:` to be a
#      linter NAME - an image value takes a legacy code path that forces a container regardless of
#      this flag.
#   2. Advisory only. The project has ~1300 findings, so any absolute quality gate fails on day one
#      and a permanently red check gets ignored. continue-on-error keeps the signal without the
#      false alarm; add failThreshold or a baseline to qodana.yml when the numbers justify it.

# A pull request's cache writes are scoped to that pull request, so only the main-branch run writes
# caches the others can restore.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Not on main: its scan saves the caches only when it finishes, so back-to-back merges would
  # otherwise cancel every save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `gh run download`, for reusing a previous run's SARIF
  actions: read
  # the action's PR summary comment
  pull-requests: write
  # inline annotations on the diff
  checks: write
  # SARIF upload to code scanning
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  # Static analysis over a code tree that already passed cannot find anything new, and Qodana is the
  # slowest thing left once the test matrix skips.
  changes:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/shared-changes.yml

  qodana:
    name: Qodana
    needs: changes
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 45
    steps:
      - name: Checkout
        id: checkout
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          # Qodana analyses the PR head rather than the merge commit, and pr-mode diffs against the
          # base, so it needs the full history.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # An unchanged code tree yields the same findings, so the previous run's SARIF is reused rather
      # than recomputed. Any failure here answers restored=false and the scan runs for real: reuse is
      # the optimisation, scanning is the correct answer.
      - name: Reuse the previous SARIF
        id: restore
        if: ${{ needs.changes.outputs.code != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ needs.changes.outputs.previous_run_id }}
          SARIF_PATH: ${{ runner.temp }}/qodana/results/qodana.sarif.json
        run: node .github/scripts/restore-qodana-sarif.js

      - name: Setup Build Environment
        if: ${{ needs.changes.outputs.code == 'true' || steps.restore.outputs.restored != 'true' }}
        id: setup-env
        uses: ./.github/actions/setup-env
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gradle-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Qodana imports the Gradle project; it never runs the quoter, so the BEAM toolchain is
          # dead weight here.
          setup-elixir: 'false'
          # Qodana's import resolves configurations the test matrix does not; the main-branch run
          # saves them under this job's own key.
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Qodana Scan
        if: ${{ needs.changes.outputs.code == 'true' || steps.restore.outputs.restored != 'true' }}
        id: qodana
        # Advisory: findings must never fail the check. See the header.
        continue-on-error: true
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: "--linter qodana-jvm-community --within-docker false"
          # Only the files the PR touches, which is the whole reason this is affordable per-PR. Off
          # elsewhere: on main's merge commits it only produces a merge-commit checkout warning.
          pr-mode: ${{ github.event_name == 'pull_request' }}
          # The default keys are per ref, so a pull request would never find main's entry; restore
          # the latest main-branch cache instead, and save only from main.
          use-caches: true
          cache-default-branch-only: true
          additional-cache-key: qodana-2026.2-refs/heads/main
          upload-result: true
          artifact-name: qodana-report
          post-pr-comment: true
          use-annotations: true
          push-fixes: 'none'

      - name: Upload SARIF to code scanning
        id: upload-sarif
        # Attempted for fork PRs too, rather than skipped. upload-sarif is documented to reach an
        # endpoint that does not require `security-events: write`, but that is not something this
        # repository has exercised - so try the upload and let it fail harmlessly if the token is
        # too weak, instead of guessing and reporting nothing.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana
