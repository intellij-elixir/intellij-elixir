name: Verify Plugin

# Runs the IntelliJ plugin verifier against one IDE per job, fanned out over a matrix supplied by the
# caller. It verifies an artifact the caller has already built and uploaded; it never builds the
# plugin itself. The verifier runs from the standalone Gradle build in .github/verify, which configures
# nothing of the plugin build and needs no Elixir.
#
# One IDE per verifier JVM is deliberate. The verifier parallelises verification internally, so
# bundling several IDEs into one invocation only serialises the download phase, and past about six
# IDEs it trips an upstream ClosedFileSystemException: intellij-plugin-structure caches JAR
# filesystems and closes them under pressure, and FsHandlerFileSystemProvider.checkAccess is the one
# operation not wrapped in its retryOnClosedFs helper, so a Files.exists() on an evicted handle makes
# the IDE's Core plugin fail to load and aborts the whole run. Upstream: MP-8301, a residual gap in
# the MP-7267 fix.

on:
  # Run one product/version by hand - against the newest CI build, a release, or any URL - without
  # rebuilding or re-running tests. Every verifier setting is exposed here, so a compatibility question
  # can be asked without editing this file.
  #
  # A workflow_dispatch event accepts at most TEN inputs and this uses all ten. An eleventh setting has
  # to be made by CONSOLIDATING, not appending - which is why `plugin` carries the source and the
  # reference in one value rather than as a pair.
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to verify against (intellij-repository artifact id).'
        required: true
        type: choice
        options:
          - ideaIU
          - ideaIC
          - rubymine
          - pycharmPC
          - pycharmPY
          - webstorm
          - goland
          - clion
          - phpstorm
          - riderRD
          - mps
        default: ideaIU
      version:
        description: 'Marketing version (2026.1.5), build number (263.5701.42), or LATEST-EAP-SNAPSHOT for the active EAP or RC.'
        required: true
        type: string
      plugin:
        description: 'Plugin zip to verify: latest-ci for the newest CI build on this ref, a release tag, or an https:// URL.'
        required: true
        type: string
        default: latest-ci
      # Everything from here down is passed straight to the plugin verifier, and each default is what
      # this workflow uses when nothing is supplied - so a dispatch form arrives pre-filled with the
      # settings CI actually runs, and editing one field changes only that field.
      #
      # The defaults are repeated in the workflow_call block below because the two triggers have
      # separate input sets and workflow YAML supports no anchors. Change one, change both.
      verifier-version:
        description: 'Passed to the plugin verifier. The version of verifier-all.jar to download and use for verification.'
        required: false
        type: string
        default: LATEST
      # Two levels are absent on purpose, and switching either on here for a one-off run is the way to
      # see what it would cost - do not add them to the default until it is zero:
      #   MISSING_DEPENDENCIES - RubyMine fails it, because the verifier does not understand "optional"
      #     dependencies.
      #   INTERNAL_API_USAGES - all-or-nothing, and the verifier has no per-usage allowlist, so it would
      #     fail on the usages JetBrains have agreed to ignore. Enforced instead by the
      #     `Check internal API usages against the allowlist` step.
      failure-levels:
        description: 'Passed to the plugin verifier. The list of failure levels you want to set. Any set and found will cause this action to fail. One of COMPATIBILITY_WARNINGS, COMPATIBILITY_PROBLEMS, DEPRECATED_API_USAGES, EXPERIMENTAL_API_USAGES, INTERNAL_API_USAGES, OVERRIDE_ONLY_API_USAGES, NON_EXTENDABLE_API_USAGES, PLUGIN_STRUCTURE_WARNINGS, MISSING_DEPENDENCIES, INVALID_PLUGIN, NOT_DYNAMIC, whitespace-separated.'
        required: false
        type: string
        default: COMPATIBILITY_PROBLEMS INVALID_PLUGIN NON_EXTENDABLE_API_USAGES OVERRIDE_ONLY_API_USAGES
      mute-plugin-problems:
        description: 'Passed to the plugin verifier. The comma-separated list of rules to suppress. See https://github.com/JetBrains/intellij-plugin-verifier?tab=readme-ov-file#specific-options for a list of valid values.'
        required: false
        type: string
        default: ''
      external-prefixes:
        description: 'Passed to the plugin verifier. Colon-separated list of external class prefixes to ignore for "No such class" errors (verifier -external-prefixes).'
        required: false
        type: string
        default: org.jetbrains.jps
      verification-reports-formats:
        description: 'Passed to the plugin verifier. Comma-separated list of verification report output formats. Supported: plain, html, markdown. plain is always written, because the verdict is read from it.'
        required: false
        type: string
        default: plain,markdown,html
      add-to-summary:
        description: 'Comma-separated list of report filenames to append to the GitHub Actions Job Summary, grouped by IDE. Aliases: "markdown" (all .md files), "plain" (all .txt files). Text files >3 lines are collapsed. Leave unset to skip.'
        required: false
        type: string
        default: verification-verdict.txt,compatibility-problems.txt,invalid-plugin.txt
      # Declared for both triggers: workflow_call and workflow_dispatch have SEPARATE input sets, so
      # a call-only input reads as empty on the dispatch path - which for a boolean means "off".
      upload-verifier-reports:
        description: 'Upload each leg''s verification reports as an artifact.'
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      matrix:
        description: 'Verification legs as a JSON matrix: {"include":[{"product":"ideaIU","version":"LATEST-EAP-SNAPSHOT","build":"263.5701.42","job":"ideaIU LATEST-EAP-SNAPSHOT"},...]}. product is an intellij-repository artifact id, version the declared version, build what it resolved to and job the job name (compose-legs.js).'
        # Required, so a caller that forgets it fails at call time with a clear message rather than
        # falling through to the manual-dispatch branch and verifying ":".
        required: true
        type: string
      # No default here on purpose. This input is call-only, so on the dispatch path it reads as empty,
      # and an empty value still counts as "provided" - the fallback therefore has to live at the point
      # of use, where it applies to both paths.
      plugin-artifact:
        description: 'Name of the artifact holding the built plugin zip, uploaded earlier in this run. Defaults to plugin-distribution.'
        required: false
        type: string
      # Same verifier settings as the dispatch block above, with the same defaults, so a caller that
      # passes none gets exactly what a manual run with an untouched form gets. Change one, change both.
      verifier-version:
        description: 'Passed to the plugin verifier. The version of verifier-all.jar to download and use for verification.'
        required: false
        type: string
        default: LATEST
      failure-levels:
        description: 'Passed to the plugin verifier. The list of failure levels you want to set. Any set and found will cause this action to fail. One of COMPATIBILITY_WARNINGS, COMPATIBILITY_PROBLEMS, DEPRECATED_API_USAGES, EXPERIMENTAL_API_USAGES, INTERNAL_API_USAGES, OVERRIDE_ONLY_API_USAGES, NON_EXTENDABLE_API_USAGES, PLUGIN_STRUCTURE_WARNINGS, MISSING_DEPENDENCIES, INVALID_PLUGIN, NOT_DYNAMIC, whitespace-separated.'
        required: false
        type: string
        default: COMPATIBILITY_PROBLEMS INVALID_PLUGIN NON_EXTENDABLE_API_USAGES OVERRIDE_ONLY_API_USAGES
      mute-plugin-problems:
        description: 'Passed to the plugin verifier. The comma-separated list of rules to suppress. See https://github.com/JetBrains/intellij-plugin-verifier?tab=readme-ov-file#specific-options for a list of valid values.'
        required: false
        type: string
        default: ''
      external-prefixes:
        description: 'Passed to the plugin verifier. Colon-separated list of external class prefixes to ignore for "No such class" errors (verifier -external-prefixes).'
        required: false
        type: string
        default: org.jetbrains.jps
      verification-reports-formats:
        description: 'Passed to the plugin verifier. Comma-separated list of verification report output formats. Supported: plain, html, markdown. plain is always written, because the verdict is read from it.'
        required: false
        type: string
        default: plain,markdown,html
      add-to-summary:
        description: 'Comma-separated list of report filenames to append to the GitHub Actions Job Summary, grouped by IDE. Aliases: "markdown" (all .md files), "plain" (all .txt files). Text files >3 lines are collapsed. Leave unset to skip.'
        required: false
        type: string
        default: verification-verdict.txt,compatibility-problems.txt,invalid-plugin.txt
      upload-verifier-reports:
        description: 'Upload each leg''s verification reports as an artifact.'
        required: false
        type: boolean
        default: true

permissions:
  # contents: read covers `gh release download`; actions: read covers pulling an artifact from
  # another run for the latest-ci source.
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    # The word `verify` is deliberately absent: the check name for a reusable workflow is
    # `<caller job name> / <callee job name>`, the caller job has no name: so its id `verify` is used,
    # and the checks graph truncates around 24-27 characters - `verify / verify (ideaIU, 2026...` spent
    # its whole budget saying verify twice. `verify / ideaIU 2026.1.5` fits.
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      # One product failing verification must not cancel the others: each leg is an independent
      # compatibility answer.
      fail-fast: false
      # A caller passes the whole matrix; a manual dispatch names one product and version, which is
      # turned into a single-leg matrix here so the job body serves both. On the dispatch path
      # inputs.matrix is null, and GitHub casts null and '' to the same value, so the test picks the
      # right branch. In format(), '{{' emits a literal '{'. A dispatch run names its job without the
      # build a pointer resolves to, which it finds in the job; it is never reused, so the name needs none.
      matrix: >-
        ${{ inputs.matrix != ''
            && fromJson(inputs.matrix)
            || fromJson(format('{{"include":[{{"product":"{0}","version":"{1}","job":"{0} {1}"}}]}}', inputs.product, inputs.version)) }}

    steps:
      # The verify build, the Gradle wrapper and catalog it runs with, setup-env, and the internal API
      # gate - nothing of the plugin's sources. MUST be first: checkout clears the workspace unless it is
      # already a clone of this repo, so later it would delete the staged plugin zip.
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The head commit, as `build-plugin` uses: the allowlist must come from the same commit as the
          # zip. `github.ref` on a pull request is the synthesised merge ref, whose base may have removed
          # an entry the head-built zip still needs.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-env
            .github/internal-api-usages-allowlist.txt
            .github/scripts
            .github/verify
            gradle/libs.versions.toml
            gradle/wrapper
            gradlew
          sparse-checkout-cone-mode: false

      # A called leg arrives with its build resolved by compose-legs.js, so only a dispatch of
      # LATEST-EAP-SNAPSHOT reaches the network here. With no active pre-release `build` is empty and
      # every later step skips: the leg passes with a notice.
      - name: Resolve IDE build
        id: resolve
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ matrix.build || matrix.version }}
        run: node .github/scripts/ide-releases.js

      # Every source lands a zip in build/distributions, so nothing downstream varies.
      - name: Download plugin distribution (this run)
        id: download-plugin-same-run
        if: ${{ inputs.matrix != '' && steps.resolve.outputs.build != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.plugin-artifact || 'plugin-distribution' }}
          path: build/distributions

      - name: Fetch plugin (manual dispatch)
        id: fetch-plugin
        if: ${{ inputs.matrix == '' && steps.resolve.outputs.build != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PLUGIN: ${{ inputs.plugin }}
          PLUGIN_ARTIFACT: ${{ inputs.plugin-artifact || 'plugin-distribution' }}
        run: |
          set -euo pipefail
          mkdir -p build/distributions

          # One input rather than a source/reference pair: a URL and a tag are distinguishable, and a
          # workflow_dispatch event allows only ten inputs, all of which are now settings worth having.
          case "$PLUGIN" in
            latest-ci)
              # The newest unexpired artifact of that name on this ref. Deliberately NOT
              # `gh run list --workflow shared-test.yml`: when shared-test.yml runs via
              # workflow_call its run is attributed to the CALLER (Release / Tag Release), so a
              # workflow-scoped query misses every release-path build - on main it would only ever
              # find old workflow_dispatch runs whose artifacts have expired. Asking the artifacts
              # API finds the plugin whoever built it. `sort -n | tail -1` picks the newest across
              # pages, which a --jq max_by cannot do (it runs per page).
              run_id=$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$PLUGIN_ARTIFACT&per_page=100" \
                --jq '.artifacts[]
                      | select(.expired == false)
                      | select(.workflow_run.head_branch == env.BRANCH)
                      | .workflow_run.id' | sort -n | tail -1)
              [ -n "$run_id" ] || {
                echo "::error::no unexpired '$PLUGIN_ARTIFACT' artifact found for $BRANCH - build one first, or set plugin to a release tag or a URL"
                exit 1
              }
              echo "Using artifact '$PLUGIN_ARTIFACT' from run $run_id"
              gh run download "$run_id" --name "$PLUGIN_ARTIFACT" --dir build/distributions
              ;;
            http://*|https://*)
              echo "Downloading $PLUGIN"
              curl -sSL --fail -o build/distributions/plugin.zip "$PLUGIN"
              ;;
            '')
              echo "::error::plugin is empty - set it to latest-ci, a release tag, or an https:// URL"
              exit 1
              ;;
            *)
              echo "Using the plugin zip attached to release $PLUGIN"
              gh release download "$PLUGIN" --pattern '*.zip' --dir build/distributions
              ;;
          esac

      # More than one zip, or none, would verify the wrong thing or fail inside the verifier with a less
      # obvious message.
      - name: Check exactly one plugin zip is staged
        id: check-plugin
        if: ${{ steps.resolve.outputs.build != '' }}
        run: |
          shopt -s nullglob
          zips=(build/distributions/*.zip)
          printf '%s\n' "${zips[@]}"
          [ "${#zips[@]}" -eq 1 ] || {
            echo "::error::expected exactly one zip in build/distributions, found ${#zips[@]}"
            exit 1
          }
          echo "zip=$GITHUB_WORKSPACE/${zips[0]}" >> "$GITHUB_OUTPUT"

      # The cache namespace carries the product: RubyMine and IDEA share marketing versions, and the key
      # would otherwise restore one product's IDE into the other's leg. Java 21 runs Gradle and the
      # verifier CLI; each IDE is verified against its own bundled JBR.
      - name: Setup Build Environment
        id: setup-env
        if: ${{ steps.resolve.outputs.build != '' }}
        uses: ./.github/actions/setup-env
        with:
          setup-elixir: false
          idea-version: ${{ steps.resolve.outputs.build }}
          java-version: '21'
          cache-key-prefix: verify-${{ matrix.product }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Plugin
        id: verify
        if: ${{ steps.resolve.outputs.build != '' }}
        env:
          ARCHIVE: ${{ steps.check-plugin.outputs.zip }}
          IDE_CODE: ${{ steps.resolve.outputs.code }}
          IDE_BUILD: ${{ steps.resolve.outputs.build }}
          VERIFIER_VERSION: ${{ inputs.verifier-version }}
          FAILURE_LEVELS: ${{ inputs.failure-levels }}
          MUTE_PLUGIN_PROBLEMS: ${{ inputs.mute-plugin-problems }}
          EXTERNAL_PREFIXES: ${{ inputs.external-prefixes }}
          REPORT_FORMATS: ${{ inputs.verification-reports-formats }}
        run: |
          set -o pipefail
          ./gradlew -p .github/verify verifyPlugin -Dorg.gradle.console=plain \
            "-Parchive=$ARCHIVE" \
            "-PideCode=$IDE_CODE" \
            "-PideVersion=$IDE_BUILD" \
            "-PverifierVersion=$VERIFIER_VERSION" \
            "-PfailureLevels=$FAILURE_LEVELS" \
            "-PmutePluginProblems=$MUTE_PLUGIN_PROBLEMS" \
            "-PexternalPrefixes=$EXTERNAL_PREFIXES" \
            "-PreportFormats=$REPORT_FORMATS" \
            2>&1 | tee verification_result.log

      - name: Add verification reports to the job summary
        id: summary
        if: ${{ !cancelled() && steps.resolve.outputs.build != '' }}
        env:
          REPORTS_DIR: .github/verify/build/reports/pluginVerifier
          ADD_TO_SUMMARY: ${{ inputs.add-to-summary }}
          LEG: ${{ matrix.product }} ${{ steps.resolve.outputs.build }}
        run: node .github/scripts/verify-summary.js

      # Runs on every path, dispatch included: a one-off run is asking whether that zip passes TODAY's
      # approved list. Placed BEFORE Upload Verify Reports so that step's `failure()` still uploads the
      # report naming the usage - on `pull_request` its `inputs` are empty, so `failure()` is the only
      # thing that uploads.
      - name: Check internal API usages against the allowlist
        id: internal-api-usages
        if: ${{ !cancelled() && steps.resolve.outputs.build != '' }}
        env:
          REPORTS_DIR: .github/verify/build/reports/pluginVerifier
          # `outcome`, not `failure()`: a leg that never downloaded its plugin is `skipped` and a timed-out
          # one is `cancelled`; the script only demands reports when verification actually succeeded.
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          LEG: ${{ matrix.product }} ${{ steps.resolve.outputs.build }}
        run: node .github/scripts/check-internal-api-usages.js

      # One verification per job, so the log needs no per-product name - the artifact name carries the
      # product and version instead.
      #
      # `inputs.upload-verifier-reports` is always false on `pull_request`: the `inputs` context is
      # empty for that trigger, and a `workflow_call` default applies only when the workflow is called.
      # `failure()` is what uploads there, and it works only while `Verify Plugin` has no
      # `continue-on-error`.
      - name: Upload Verify Reports
        id: upload-verify-reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (failure() || inputs.upload-verifier-reports) && steps.resolve.outputs.build != '' }}
        with:
          name: verify-plugin-reports-${{ matrix.product }}-${{ matrix.version }}
          path: |
            verification_result.log
            .github/verify/build/reports/pluginVerifier
          retention-days: 30
          if-no-files-found: warn
