# =============================================================================
# Build Configuration Properties
# Purpose: Defines project constants, platform targets, and JVM settings.
# =============================================================================

# --- Plugin Metadata ---
pluginGroup=org.elixir_lang
pluginName=Elixir
pluginVersion=25.0.0
pluginRepositoryUrl=https://github.com/intellij-elixir/intellij-elixir/
vendorName=Kadie Enheduanna Inanna
vendorEmail=Kronic.Deth@gmail.com
pluginSinceBuild=261.22158.277
publishChannels=canary

# --- Changelog ---
# CHANGELOG.md is in Keep a Changelog format and is the single source of the plugin's change notes.
# Declared here rather than in build.gradle.kts because two consumers read them: the build, and the
# per-pull-request check in .github/workflows/changelog.yml - which can parse a properties file
# without regexing Kotlin source.
#
# changelogGroups is the full section vocabulary, in the order patchChangelog scaffolds them into a
# new Unreleased block. Comma-separated, so a group name may not contain a comma.
changelogGroups=Breaking changes,Enhancements,Bug Fixes,Threading / Platform Hygiene,Build / CI
# Which of those reach the Marketplace "What's New". Must be a subset of changelogGroups; the build
# fails if it is not. Everything else is recorded for contributors but says nothing a user observes.
# Breaking changes belongs here: it is the entry a reader most needs, and a version whose only group
# is unpublished renders empty and is dropped from the panel entirely.
changelogPublishedGroups=Breaking changes,Enhancements,Bug Fixes
# How many versions the "What's New" lists, counting the one being built - so it plus the three before
# it. Lowered from five because the rendered change notes outgrew what the build accepts.
changelogPublishedVersions=4

# Set to True to skip building searchable options, if developing this drastically speeds up build times.
# See https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin-faq.html#how-to-disable-building-searchable-options
skipSearchableOptions=false

# --- JPS Modules ---
# jps-shared and jps-builder run in IntelliJ's external build process, on the project SDK's JDK,
# which the platform guarantees only to be 11+ (BuildManager.MINIMUM_REQUIRED_JPS_BUILD_JAVA_VERSION).
# At the plugin's own level the build process cannot load them.
jpsJavaLevel=11

# --- Platform Targets ---
platformType=IU
# Tracks the lowest supported platform (minimumSupported in .github/ci-versions.json /
# pluginSinceBuild below), not the newest - buildPlugin takes no -PplatformVersion override, so
# whatever this is set to is what actually ships. Override per-invocation for local dev against a
# newer IDE (-PplatformVersion=<version>).
platformVersion=2026.1.5
# Enable this to pull in the latest EAP version.
useDynamicEapVersion=false

# --- IDE Run Configuration Versions ---
enableEAPIDEs=true

# Stable Versions (2026.1)
platformVersionIntellijIdea=2026.1.5
platformVersionRubyMine=2026.1.5
platformVersionPyCharm=2026.1.5
platformVersionWebStorm=2026.1.5
platformVersionRustRover=2026.1.1
platformVersionCLion=2026.1.1
platformVersionGoLand=2026.1.5
platformVersionPhpStorm=2026.1.1

# EAP Versions
platformVersionIntellijIdeaEAP=262-EAP-SNAPSHOT
platformVersionRubyMineEAP=262-EAP-SNAPSHOT
platformVersionPyCharmEAP=262-EAP-SNAPSHOT
platformVersionWebStormEAP=262-EAP-SNAPSHOT
platformVersionRustRoverEAP=262-EAP-SNAPSHOT
platformVersionCLionEAP=262-EAP-SNAPSHOT
platformVersionGoLandEAP=262-EAP-SNAPSHOT
platformVersionPhpStormEAP=262-EAP-SNAPSHOT

# --- Plugin Verification ---
# Comma-separated list of IDE types to verify against
